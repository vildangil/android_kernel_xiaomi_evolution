name: Build ReSukiSU kernel

"on":
  workflow_dispatch:
  push:
    branches: [Miui-v2]
    paths:
      - ".github/workflows/build-resukisu.yml"

permissions:
  contents: read

jobs:
  build:
    name: rosemary
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: rosemary_defconfig
      OUT: out
      KBUILD_BUILD_USER: vildang
      KBUILD_BUILD_HOST: github-actions

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip unzip rsync gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Clang
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/clang"
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Integrate latest ReSukiSU
        shell: bash
        run: |
          set -euxo pipefail
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash

      - name: Fetch and apply SUSFS 4.14 backport
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch kernel-4.14-backport https://github.com/devnoname120/susfs4ksu-toco.git susfs4ksu
          find susfs4ksu/kernel_patches -maxdepth 2 -type f | sort

          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h

          SUSFS_PATCH="$(find susfs4ksu/kernel_patches -maxdepth 1 -type f -name '*4.14*.patch' | head -n1)"
          test -n "$SUSFS_PATCH"
          patch -p1 --forward < "$SUSFS_PATCH"

      - name: Configure ReSukiSU and SUSFS
        shell: bash
        run: |
          set -euxo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"

          sed -i             -e '/^CONFIG_KSU=/d'             -e '/^CONFIG_KSU_TRACEPOINT_HOOK=/d'             -e '/^CONFIG_KSU_MANUAL_HOOK=/d'             -e '/^CONFIG_KSU_SUSFS=/d'             -e '/^CONFIG_KSU_SUSFS_/d'             "$CFG"

          cat >> "$CFG" <<'EOF'

# ReSukiSU + SUSFS
CONFIG_KSU=y
# CONFIG_KSU_TRACEPOINT_HOOK is not set
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
# CONFIG_KSU_SUSFS_ENABLE_LOG is not set
EOF

      - name: Generate config
        shell: bash
        run: |
          set -euxo pipefail
          make O="$OUT" ARCH=arm64 "$DEFCONFIG"
          make O="$OUT" ARCH=arm64 olddefconfig
          grep -E '^(CONFIG_KSU|# CONFIG_KSU)' "$OUT/.config" || true
          grep -q '^CONFIG_KSU=y' "$OUT/.config"
          grep -q '^CONFIG_KSU_SUSFS=y' "$OUT/.config"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O="$OUT" ARCH=arm64             CC=clang             LD=ld.lld             AR=llvm-ar             NM=llvm-nm             OBJCOPY=llvm-objcopy             OBJDUMP=llvm-objdump             STRIP=llvm-strip             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_ARM32=arm-linux-gnueabi-             Image.gz-dtb

      - name: Collect artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp "$OUT/.config" artifacts/kernel.config
          find "$OUT/arch/arm64/boot" -maxdepth 1 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' \) -exec cp -v {} artifacts/ \;
          git -C KernelSU rev-parse HEAD > artifacts/resukisu-commit.txt
          git -C susfs4ksu rev-parse HEAD > artifacts/susfs-commit.txt
          test -n "$(find artifacts -maxdepth 1 -type f -name 'Image*' -print -quit)"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-ReSukiSU-SUSFS-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
